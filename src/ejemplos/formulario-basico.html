<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Profesional</title>
    <link rel="stylesheet" href="formulario-basico.css">
</head>
<body>
    <div class="login-container">
        <h1>Iniciar Sesión</h1>
        <form class="login-form" action="#" method="post">
            <label for="usuario">Usuario o Correo</label>
            <input type="text" id="usuario" name="usuario" placeholder="Tu usuario o correo" required autocomplete="username">

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Tu contraseña" required autocomplete="current-password">

            <div class="extra">
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
